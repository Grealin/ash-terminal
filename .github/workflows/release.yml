name: Release Build

on:
  push:
    tags:
      - 'release*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Developer Mode (for symlinks)
        run: |
          # Enable symlinks without admin rights
          git config --global core.symlinks true
        shell: pwsh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: yarn install

      - name: Create .env file with SECRET_KEY
        run: |
          "SECRET_KEY=${{ secrets.SECRET_KEY }}" | Set-Content -Path .env -Encoding utf8
        shell: pwsh

      - name: Format code
        run: yarn format

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build Windows
        run: yarn build:win -- --publish never

      - name: Get version from package.json
        id: package-version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ash-terminal-${{ steps.package-version.outputs.version }}-win32-x64.zip
            dist/ash-terminal-${{ steps.package-version.outputs.version }}-setup-x64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
